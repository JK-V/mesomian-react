name: Release

on:
  push:
    branches: [master]

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changeset.outputs.published }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Create version bump PR
        id: changeset
        run: |
          git config user.name "mesomian-bot"
          git config user.email "bot@mesomian.dev"
          npm run version
          git add -A
          git commit -m "chore: version packages" || echo "No changes to commit"
          git push origin master || true
          echo "published=true" >> $GITHUB_OUTPUT

  publish:
    needs: version
    if: needs.version.outputs.published == 'true' && github.repository_owner == 'JK-V'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Publish to npm
        run: npm run release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
